apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pr-mirror-app.configmapName" . }}
  labels:
    {{- include "pr-mirror-app.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
